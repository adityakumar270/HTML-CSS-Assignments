<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CSS selector types practical assignment">
    <title>Assignment 22 - CSS Selectors</title>

    <style>
        /* 1. Element Selector */
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f6fc;
            margin: 20px;
        }

        /* 2. Class Selector */
        .heading {
            color: navy;
            text-align: center;
        }

        /* 3. ID Selector */
        #intro {
            background-color: white;
            padding: 15px;
            border: 1px solid lightgray;
        }

        /* 4. Group Selector */
        h2, p {
            color: #333333;
        }

        /* 5. Descendant Selector */
        nav a {
            color: blue;
            text-decoration: none;
            margin-right: 15px;
        }
    </style>
</head>
<body>

    <h1 class="heading">Welcome to My Website</h1>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>

    <section id="intro">
        <h2>About My Website</h2>
        <p>My name is Aditya.</p>
        <p>I am a BCA (AI) student.</p>
        <p>I am learning HTML and CSS.</p>
    </section>

</body>
</html>
