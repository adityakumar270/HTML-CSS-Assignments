<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Three differently styled CSS cards">
    <title>Assignment 27 - Card Variants</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f7;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #17365d;
        }

        .container {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card {
            width: 250px;
            padding: 20px;
            box-sizing: border-box;
        }

        .card1 {
            background-color: #e6f2ff;
            border-radius: 15px;
            border: 2px solid #9ccaff;
        }

        .card2 {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-radius: 30px;
        }

        .card3 {
            background-color: #fff8e1;
            border-radius: 50px;
            border: 2px solid #f5d58a;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 20px;
            background-color: #17365d;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>My Three Card Designs</h1>

    <div class="container">

        <div class="card card1">
            <h2>Card 1</h2>
            <p>Rounded rectangle with a light blue background.</p>
            <button>Explore</button>
        </div>

        <div class="card card2">
            <h2>Card 2</h2>
            <p>More rounded corners with a purple gradient background.</p>
            <button>Learn More</button>
        </div>

        <div class="card card3">
            <h2>Card 3</h2>
            <p>Very rounded corners with a light cream background.</p>
            <button>See More</button>
        </div>

    </div>

</body>
</html>
