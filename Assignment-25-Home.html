<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Styled multi-page student website">
    <title>Home - My Website</title>

    <style>
        :root {
            --primary: #17365d;
            --accent: #d5a84f;
            --background: #eef2f7;
            --surface: #ffffff;
            --text: #263238;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--background);
            color: var(--text);
            margin: 0;
            line-height: 1.6;
        }

        header {
            background: var(--primary);
            color: white;
            text-align: center;
            padding: 25px;
        }

        nav {
            background: var(--surface);
            text-align: center;
            padding: 15px;
        }

        nav a {
            color: var(--primary);
            text-decoration: none;
            font-weight: bold;
            margin: 0 10px;
        }

        main {
            max-width: 800px;
            margin: 25px auto;
            padding: 25px;
            background: var(--surface);
            border-top: 4px solid var(--accent);
            border-radius: 8px;
        }

        footer {
            text-align: center;
            padding: 15px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to My Website</h1>
        <p>A simple student website</p>
    </header>

    <nav>
        <a href="Assignment-25-Home.html">Home</a>
        <a href="Assignment-25-About.html">About</a>
        <a href="Assignment-25-Registration.html">Registration</a>
        <a href="Assignment-25-Contact.html">Contact</a>
    </nav>

    <main>
        <h2>Home Page</h2>
        <p>Welcome to my multi-page HTML and CSS project.</p>
        <p>Explore the About, Registration and Contact pages using the navigation links above.</p>
    </main>

    <footer>
        <p>Assignment 25 | HTML and CSS</p>
    </footer>
</body>
</html>
