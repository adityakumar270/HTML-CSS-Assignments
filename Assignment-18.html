<!DOCTYPE html>
<html>
<head>
    <title>Product Size Chart</title>
</head>
<body>

    <h1>T-Shirt Size Chart</h1>
    <p>Sample size chart for clothing products.</p>

    <table border="1">
        <thead>
            <tr>
                <th>Size</th>
                <th>Chest (inches)</th>
                <th>Waist (inches)</th>
                <th>Length (inches)</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>S</td>
                <td>36</td>
                <td>30</td>
                <td>26</td>
            </tr>
            <tr>
                <td>M</td>
                <td>38</td>
                <td>32</td>
                <td>27</td>
            </tr>
            <tr>
                <td>L</td>
                <td>40</td>
                <td>34</td>
                <td>28</td>
            </tr>
            <tr>
                <td>XL</td>
                <td>42</td>
                <td>36</td>
                <td>29</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
