<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Styled profile card component">
    <title>Assignment 30 - Profile Card</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color: #eef2f7;
            padding: 20px;
        }

        .profile-card {
            width: 100%;
            max-width: 350px;
            background-color: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        .card-header {
            height: 120px;
            background: linear-gradient(135deg, #17365d, #477db5);
        }

        .profile-image {
            width: 110px;
            height: 110px;
            margin-top: -55px;
            border-radius: 50%;
            border: 5px solid white;
            background-color: #dce8f5;
            display: inline-block;
            object-fit: cover;
        }

        .card-content {
            padding: 20px 25px 25px;
        }

        h1 {
            color: #17365d;
            font-size: 25px;
            margin: 10px 0 5px;
        }

        .role {
            color: #d5a84f;
            font-weight: bold;
            margin: 5px 0 15px;
        }

        .description {
            color: #555;
            line-height: 1.6;
            font-size: 15px;
        }

        .skills {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin: 18px 0;
        }

        .skills span {
            background-color: #eef2f7;
            color: #17365d;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 13px;
        }

        .profile-button {
            display: inline-block;
            background-color: #17365d;
            color: white;
            padding: 12px 24px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }

        .profile-button:hover {
            background-color: #2c5685;
        }
    </style>
</head>

<body>

    <article class="profile-card">

        <div class="card-header"></div>

        <div class="card-content">

            <div class="profile-image" role="img"
                 aria-label="Profile image placeholder"></div>

            <h1>Aditya Kumar</h1>

            <p class="role">BCA (AI) Student</p>

            <p class="description">
                I am learning programming and web development.
                My goal is to become a software developer.
            </p>

            <div class="skills">
                <span>Java</span>
                <span>HTML</span>
                <span>CSS</span>
            </div>

            <a class="profile-button" href="Assignment-25-About.html">
                View About Page
            </a>

        </div>

    </article>

</body>
</html>
