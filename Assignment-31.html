<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Responsive menu bar using CSS Flexbox">
    <title>Assignment 31 - Flexbox Menu</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #eef2f7;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #17365d;
            padding: 15px 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .menu {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .menu a {
            color: white;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 5px;
        }

        .menu a:hover {
            background-color: #d5a84f;
            color: #17365d;
        }

        .content {
            text-align: center;
            padding: 60px 20px;
        }

        .content h1 {
            color: #17365d;
        }

        .content p {
            color: #444;
            line-height: 1.6;
        }

        @media (max-width: 600px) {
            .navbar {
                flex-direction: column;
                padding: 15px;
            }

            .menu {
                justify-content: center;
                gap: 8px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="logo">My Website</div>

        <div class="menu">
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#services">Services</a>
            <a href="#contact">Contact</a>
        </div>
    </nav>

    <main class="content" id="home">
        <h1>Welcome to My Website</h1>
        <p>
            This is a simple responsive menu bar created using
            CSS Flexbox.
        </p>
    </main>

</body>
</html>
