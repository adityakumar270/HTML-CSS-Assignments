<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
</head>
<body>

    <h1>Job Application Form</h1>

    <form>
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone">
        <br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob">
        <br><br>

        <label for="position">Job Position:</label>
        <select id="position" name="position">
            <option>Web Developer</option>
            <option>Software Developer</option>
            <option>Data Analyst</option>
        </select>
        <br><br>

        <p>Work Type:</p>
        <input type="radio" id="fulltime" name="worktype" value="fulltime">
        <label for="fulltime">Full-time</label>

        <input type="radio" id="parttime" name="worktype" value="parttime">
        <label for="parttime">Part-time</label>
        <br><br>

        <label for="skills">Your Skills:</label>
        <textarea id="skills" name="skills" rows="4" cols="30"></textarea>
        <br><br>

        <label for="resume">Upload Resume:</label>
        <input type="file" id="resume" name="resume">
        <br><br>

        <label for="color">Choose a theme color:</label>
        <input type="color" id="color" name="color">
        <br><br>

        <label for="experience">Experience (years):</label>
        <input type="number" id="experience" name="experience" min="0">
        <br><br>

        <input type="checkbox" id="agree" name="agree" required>
        <label for="agree">I confirm that the information is correct.</label>
        <br><br>

        <button type="submit">Apply Now</button>
        <button type="reset">Clear Form</button>
    </form>

</body>
</html>
