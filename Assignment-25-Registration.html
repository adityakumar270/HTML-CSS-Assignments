<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Registration page - Student website">
    <title>Registration - My Website</title>

    <style>
        :root {
            --primary: #17365d;
            --accent: #d5a84f;
            --background: #eef2f7;
            --surface: #ffffff;
            --text: #263238;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--background);
            color: var(--text);
            margin: 0;
            line-height: 1.6;
        }

        header {
            background: var(--primary);
            color: white;
            text-align: center;
            padding: 25px;
        }

        nav {
            background: var(--surface);
            text-align: center;
            padding: 15px;
        }

        nav a {
            color: var(--primary);
            text-decoration: none;
            font-weight: bold;
            margin: 0 10px;
        }

        main {
            max-width: 800px;
            margin: 25px auto;
            padding: 25px;
            background: var(--surface);
            border-top: 4px solid var(--accent);
            border-radius: 8px;
        }

        h2 {
            color: var(--primary);
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-family: Arial, sans-serif;
        }

        button {
            margin-top: 18px;
            padding: 12px 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #254d7c;
        }

        footer {
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Student Registration</h1>
        <p>Register using the form below</p>
    </header>

    <nav>
        <a href="Assignment-25-Home.html">Home</a>
        <a href="Assignment-25-About.html">About</a>
        <a href="Assignment-25-Registration.html">Registration</a>
        <a href="Assignment-25-Contact.html">Contact</a>
    </nav>

    <main>
        <h2>Registration Form</h2>

        <form>
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname"
                   placeholder="Enter your full name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" required>

            <label for="course">Select Course:</label>
            <select id="course" name="course" required>
                <option value="">Choose a course</option>
                <option value="bca">BCA</option>
                <option value="bca-ai">BCA (AI)</option>
                <option value="other">Other</option>
            </select>

            <label for="message">Why do you want to register?</label>
            <textarea id="message" name="message" rows="4"
                      placeholder="Write a short message"></textarea>

            <button type="submit">Register</button>
        </form>
    </main>

    <footer>
        <p>Assignment 25 | HTML and CSS</p>
    </footer>

</body>
</html>
