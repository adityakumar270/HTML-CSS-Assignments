<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Responsive photo gallery using CSS Grid">
    <title>Assignment 36 - Photo Gallery</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f4f8;
        }

        header {
            text-align: center;
            padding: 30px 15px;
            background-color: #17365d;
            color: white;
        }

        header h1 {
            margin: 0 0 10px;
        }

        header p {
            margin: 0;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            padding: 30px;
            max-width: 1200px;
            margin: auto;
        }

        .photo-card {
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
            transition: transform 0.3s;
        }

        .photo-card:hover {
            transform: translateY(-5px);
        }

        .photo-card img {
            display: block;
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .photo-card h2 {
            font-size: 18px;
            color: #17365d;
            text-align: center;
            padding: 12px;
            margin: 0;
        }

        footer {
            text-align: center;
            padding: 18px;
            background-color: #17365d;
            color: white;
        }

        @media (max-width: 500px) {
            .gallery {
                grid-template-columns: 1fr;
                padding: 18px;
                gap: 15px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>My Photo Gallery</h1>
        <p>A collection of beautiful places</p>
    </header>

    <main class="gallery">

        <article class="photo-card">
            <img
                src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=600&q=80"
                alt="Beautiful mountain landscape">
            <h2>Mountain View</h2>
        </article>

        <article class="photo-card">
            <img
                src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=600&q=80"
                alt="Ocean and beach">
            <h2>Sunny Beach</h2>
        </article>

        <article class="photo-card">
            <img
                src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=600&q=80"
                alt="Green forest with sunlight">
            <h2>Green Forest</h2>
        </article>

        <article class="photo-card">
            <img
                src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=600&q=80"
                alt="Lake surrounded by mountains">
            <h2>Peaceful Lake</h2>
        </article>

        <article class="photo-card">
            <img
                src="https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=600&q=80"
                alt="Mountain under a starry sky">
            <h2>Night Sky</h2>
        </article>

        <article class="photo-card">
            <img
                src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=600&q=80"
                alt="Sunrise over a landscape">
            <h2>Golden Sunrise</h2>
        </article>

    </main>

    <footer>
        <p>Assignment 36 - CSS Grid Photo Gallery</p>
    </footer>

</body>
</html>
