<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CSS design tokens using variables">
    <title>Assignment 24 - CSS Variables</title>

    <style>
        /* Design Tokens */
        :root {
            --primary-color: #17365d;
            --secondary-color: #d5a84f;
            --background-color: #eef2f7;
            --text-color: #263238;
            --card-color: #ffffff;

            --small-font: 14px;
            --normal-font: 16px;
            --heading-font: 28px;
            --title-font: 36px;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            font-size: var(--normal-font);
            margin: 0;
            padding: 25px;
        }

        header {
            background-color: var(--primary-color);
            color: var(--card-color);
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: var(--title-font);
        }

        h2 {
            color: var(--primary-color);
            font-size: var(--heading-font);
            border-bottom: 3px solid var(--secondary-color);
            padding-bottom: 5px;
        }

        .card {
            background-color: var(--card-color);
            padding: 20px;
            margin-top: 20px;
            border-radius: 8px;
        }

        .note {
            font-size: var(--small-font);
            color: var(--primary-color);
        }

        button {
            background-color: var(--primary-color);
            color: var(--card-color);
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            font-size: var(--normal-font);
        }
    </style>
</head>
<body>

    <header>
        <h1>My Design Tokens</h1>
        <p>Learning CSS Variables</p>
    </header>

    <main>
        <section class="card">
            <h2>About CSS Variables</h2>
            <p>CSS variables store reusable values such as colours and font sizes.</p>
            <p class="note">This is an example of a small design system.</p>
            <button>Learn More</button>
        </section>
    </main>

</body>
</html>
