      <h1>How a Webpage Loads</h1>

    <p>
        When a user types a URL into a web browser,
        the browser find the server's IP address using DNS.
        It sends a request to the server.The server sends
        the required files, such as HTML, CSS, and JavaScript.
        The browser reads these files and displays the webpage.
